name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hassfest:
    name: Hassfest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

  python:
    name: Python & metadata validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Validate JSON metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for path in sorted(Path(".").rglob("*.json")):
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK: {path}")
          PY

      - name: Verify requirements.txt matches manifest.json
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(
              Path("custom_components/beatbot/manifest.json").read_text(encoding="utf-8")
          )
          manifest_reqs = set(manifest.get("requirements", []))
          req_lines = {
              line.strip()
              for line in Path("requirements.txt").read_text(encoding="utf-8").splitlines()
              if line.strip() and not line.strip().startswith("#")
          }
          if manifest_reqs != req_lines:
              raise SystemExit(
                  "requirements.txt and custom_components/beatbot/manifest.json are out of sync!\n"
                  f"  requirements.txt: {sorted(req_lines)}\n"
                  f"  manifest.json:    {sorted(manifest_reqs)}\n"
                  "Update manifest.json to match before merging."
              )
          print(f"Synced requirements: {sorted(manifest_reqs)}")
          PY

      - name: Compile integration
        run: python -m compileall -q custom_components/beatbot
